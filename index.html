></td><td>Вкладка «Дорожная карта» в карточке «Система»</td>\n      <td><code>/roadmap?system_id=</code></td><td></td></tr><tr><td><b>FR-NSI-13</b></td><td>Вкладка «Бюджеты и закупки» в карточке Системы</td>\n      <td><code>/budgets</code></td><td></td></tr><tr><td><b>FR-WORK-01</b></td><td>Вкладка «Задачи заявки» (US)</td>\n      <td><code>/works/&lt;id&gt;</code></td><td></td></tr><tr><td><b>FR-WORK-02</b></td><td>Проверка US на дублирование по всем работам</td>\n      <td><code>dup_map в work_detail (подсветка .dup)</code></td><td>04 §4.5</td></tr><tr><td><b>FR-WORK-03</b></td><td>Запрет дублей наименований работ в рамках этапа</td>\n      <td><code>POST /works (отклонение)</code></td><td>04 §4.5</td></tr><tr><td><b>FR-WORK-04</b></td><td>Периоды работ ≤ срока этапа ГК</td>\n      <td><code>POST /works (валидация дат этапа)</code></td><td>04 §4.12</td></tr><tr><td><b>FR-WORK-05</b></td><td>Кликабельные названия US</td>\n      <td><code>ссылки US в tables/work_detail.html</code></td><td></td></tr><tr><td><b>FR-WORK-06</b></td><td>Модернизация переходов между ЭФ</td>\n      <td><code>сквозные ссылки ГК↔работа↔расчёт↔ОД</code></td><td></td></tr><tr><td><b>FR-WORK-07</b></td><td>Корректировка интерфейса расчёта для РП</td>\n      <td><code>/calcs/&lt;id&gt; (блок замечаний РП)</code></td><td></td></tr><tr><td><b>FR-WORK-08</b></td><td>Блок «Размер команды»</td>\n      <td><code>team_size в карточке работы</code></td><td></td></tr><tr><td><b>FR-CALC-01</b></td><td>Формирование РСЗ по заявке v2</td>\n      <td><code>/calcs, /calcs/&lt;id&gt;</code></td><td></td></tr><tr><td><b>FR-CALC-02</b></td><td>Импорт ФОИ из Excel</td>\n      <td><code>мок-кнопка в calc_detail (без файла)</code></td><td>НФТ форматы (06)</td></tr><tr><td><b>FR-CALC-03</b></td><td>In-line работа с таблицей ФОИ («как в Excel»)</td>\n      <td><code>contenteditable cells в calc_detail</code></td><td></td></tr><tr><td><b>FR-CALC-04</b></td><td>Предзаполнение вкладки «Бизнес-постановки» в РСЗ</td>\n ></td><td>BR-SM-05</td></tr><tr><td><b>FR-AN-01</b></td><td>Обзор текущих показателей</td>\n      <td><code>/dashboard</code></td><td></td></tr><tr><td><b>FR-AN-02</b></td><td>Календарные планы ГК и СЗ с прогрессом готовности</td>\n      <td><code>/calendar (.bar)</code></td><td>BR-SM-05</td></tr><tr><td><b>FR-AN-03</b></td><td>Дашборд «Бюджеты и закупки»</td>\n      <td><code>/budgets</code></td><td></td></tr><tr><td><b>FR-AN-04</b></td><td>Диаграммы распределения сотрудников по проектам</td>\n      <td><code>/dashboard (CSS bar)</code></td><td>⚠ C-7</td></tr><tr><td><b>FR-KB-01</b></td><td>Модуль «База знаний» (MVP1)</td>\n      <td><code>/kb</code></td><td>⚠ C-9</td></tr><tr><td><b>FR-KB-02</b></td><td>База Знаний Калькулятора (вторая БП)</td>\n      <td><code>/kb (консолидировано)</code></td><td>⚠ C-9</td></tr><tr><td><b>FR-KB-03</b></td><td>Раздел «Помощь»</td>\n      <td><code>/help</code></td><td></td></tr><tr><td><b>FR-UX-01</b></td><td>Адаптивный интерфейс под масштаб экрана</td>\n      <td><code>viewport + @media в style.css</code></td><td></td></tr><tr><td><b>FR-UX-02</b></td><td>Выравнивание реестров</td>\n      <td><code>единая сетка таблиц</code></td><td></td></tr><tr><td><b>FR-UX-03</b></td><td>Подсказки в индикаторах</td>\n      <td><code>title= у KPI на дашборде</code></td><td></td></tr><tr><td><b>FR-UX-04</b></td><td>Пагинация стандартным блоком</td>\n      <td><code>мок-метка «показано N из M»</code></td><td></td></tr><tr><td><b>FR-MISC-01</b></td><td>Виджет новостей Telegram</td>\n      <td><code>/news</code></td><td>⚠ C-4</td></tr></table>\n     <div class=\"card\"><h3>Открытые конфликты источников (файл 07) и их отражение в MVP</h3>\n      <ul><li><b>C-1</b> окно смены статусов ФОИ — помечено маркером в таблице ФОИ (/calcs/&lt;id&gt;);</li>\n      <li><b>C-5/C-7</b> НДС 20%/22% (ФЗ-425) — ставка хранится per-объект, показывается как есть;</li>\n      <li><b>C-?</b> «undefined» в печатных формах — поведение сохранено (/docs/&lt;id&gt;/print);</li>\n      <li><b>C-9</b> два набора правил Базы знаний — оба отражены в /kb;</li>\n      <li>Права на изменение ГК (конфликт прав Администратора) — реализовано по матрице файла 02.</li></ul>\n      <p class=\"fr\">Маршруты MVP: /, /purchases, /gks, /systems, /subsystems, nsi_types.html, /roadmap, /budgets, /works, /calcs, /docs, /szs, /internal, /sync, /kb, /traceability</p></div>\n    </main>"};
